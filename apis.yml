name: Network Alchemy
description: 'Network Alchemy, Inc. was a Santa Cruz, California networking-security
  company backed by Trinity Ventures that developed non-stop IP infrastructure for
  secure private communications, commerce and collaboration. It marketed what it described
  as the industry''s first secure IP clustered networking (IPsec/VPN) solution, delivering
  scalability, high availability and price/performance with no single point of failure.
  The company was acquired by Nokia in February 2000 and its products were folded into
  Nokia''s network-security line. It is a defunct dot-com-era entity with no active
  website, developer portal, or public API surface; this profile is retained as a
  historical Trinity Ventures portfolio record. Enrichment found no live API artifacts
  to harvest.'
